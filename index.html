<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Grok Desk</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding-bottom: 84px; }
    .navbar { padding: 54px 16px 8px; font-size: 17px; font-weight: 600; }
    .balance { font-size: 66px; font-weight: 600; padding: 0 16px; font-variant-numeric: tabular-nums; }
    .row { display: flex; align-items: center; gap: 8px; padding: 2px 16px 8px; }
    .paper { background: #ff9f0a; color: #000; padding: 3px 9px; border-radius: 12px; font-size: 13px; font-weight: 600; }
    .mult { color: #00d35a; font-size: 15px; font-weight: 600; }
    .status { padding: 4px 16px 12px; color: rgba(235,235,245,0.6); font-size: 15px; }
    .tabbar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: rgba(28,28,30,0.92); display: flex; justify-content: space-around; padding-top: 8px; border-top: 0.5px solid rgba(84,84,88,0.55); }
    .tab { flex: 1; text-align: center; font-size: 10px; color: rgba(235,235,245,0.6); }
    .tab.active { color: #0a84ff; }
  </style>
</head>
<body>
  <div class="navbar">Grok Bot ›</div>
  <div class="balance" id="balance">$200.00</div>
  <div class="row">
    <span class="paper" id="mode">PAPER</span>
    <span class="mult" id="mult">1.00×</span>
  </div>
  <div class="status" id="status">Loading…</div>

  <div class="tabbar">
    <div class="tab active">Home</div>
    <div class="tab">Agents</div>
    <div class="tab">Activity</div>
    <div class="tab">Account</div>
  </div>

  <script>
    async function load() {
      try {
        const r = await fetch('state.json?' + Date.now());
        const s = await r.json();
        document.getElementById('balance').textContent = '$' + s.balance.toFixed(2);
        document.getElementById('mode').textContent = s.mode;
        document.getElementById('mult').textContent = s.multiplier.toFixed(2) + '×';
        document.getElementById('status').textContent = 'Updated ' + new Date(s.ts * 1000).toLocaleTimeString();
      } catch (e) {
        document.getElementById('status').textContent = 'Offline · retrying';
      }
    }
    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
